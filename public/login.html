<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sign in · XSite Auto</title>
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/app/apple.png">
<link rel="icon" href="/icons/app/192.png">
<meta name="theme-color" content="#1d5ea6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="XSite Auto">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root{--bg:#eceff3;--surface:#fff;--ink:#15202b;--muted:#5a6877;--line:#d3dae2;--accent:#1d5ea6;--accent-ink:#fff;--bad:#b0351f}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--surface:#17202a;--ink:#e4eaf0;--muted:#93a2b2;--line:#2a3642;--accent:#6da7ea;--accent-ink:#0b1824;--bad:#ef7a62;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.45 "IBM Plex Sans",system-ui,-apple-system,sans-serif}
main{min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;gap:14px}
h1{font:700 30px/1 "Barlow Condensed","Arial Narrow",sans-serif;text-transform:uppercase;letter-spacing:.03em;margin:0}
p{margin:0;color:var(--muted)}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 12px;text-transform:none;letter-spacing:0}
button{font:600 16px inherit;font-family:inherit;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:12px;cursor:pointer}
button:disabled{opacity:.6}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.err{color:var(--bad);font-size:14px;min-height:1em}
</style>
</head><body>
<main>
  <form id="f" novalidate>
    <h1 id="shopName">XSite Auto</h1>
    <p>Sign in to XSite Auto.</p>
    <label>Email<input id="email" type="email" autocomplete="username" inputmode="email" required></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <div class="err" id="err" role="alert"></div>
    <button id="go" type="submit">Sign in</button>
    <p style="font-size:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><a href="/reset">Forgot password?</a><a href="/signup" id="trial">Start a free trial</a></p>
  </form>
  <p style="text-align:center;font-size:12px;opacity:.6;margin-top:18px">Powered by XSite Auto</p>
</main>
<script>
fetch("/api/public/shop").then(r=>r.json()).then(d=>{if(d.name){document.getElementById("shopName").textContent=d.name;document.title=`Sign in · ${d.name} · XSite Auto`;document.getElementById("trial").hidden=true}}).catch(()=>{});
const f=document.getElementById("f"),err=document.getElementById("err"),go=document.getElementById("go");
f.addEventListener("submit",async e=>{
  e.preventDefault();err.textContent="";go.disabled=true;go.textContent="Signing in…";
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"content-type":"application/json"},credentials:"same-origin",
      body:JSON.stringify({email:document.getElementById("email").value,password:document.getElementById("password").value})});
    const d=await r.json().catch(()=>({}));
    if(r.ok){location.href="/";return}
    err.textContent=d.error||"Couldn't sign in. Try again.";
  }catch(x){err.textContent="Can't reach the shop book. Check your connection."}
  go.disabled=false;go.textContent="Sign in";
});
</script>
<script>
/* Show or hide the password: an eye button inside each password box. */
(function(){
  var EYE='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  var OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24M1 1l22 22"/></svg>';
  document.querySelectorAll('input[type="password"]').forEach(function(inp){
    var wrap=document.createElement('span');
    wrap.style.cssText='position:relative;display:block';
    inp.parentNode.insertBefore(wrap,inp);wrap.appendChild(inp);
    inp.style.paddingRight='44px';inp.style.width='100%';inp.style.boxSizing='border-box';
    var b=document.createElement('button');
    b.type='button';b.innerHTML=EYE;b.setAttribute('aria-label','Show password');b.title='Show password';
    b.style.cssText='position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#5a6877;cursor:pointer;padding:0;margin:0;min-height:0;box-shadow:none';
    b.addEventListener('click',function(){
      var show=inp.type==='password';inp.type=show?'text':'password';
      b.innerHTML=show?OFF:EYE;b.setAttribute('aria-label',show?'Hide password':'Show password');b.title=b.getAttribute('aria-label');inp.focus();
    });
    wrap.appendChild(b);
  });
})();
</script>
</body></html>
