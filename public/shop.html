<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a service writer's board. Sticky header, one working column, bottom tab bar on phones. */
:root{
  --bg:#eceff3; --surface:#ffffff; --sunk:#f5f7f9; --ink:#15202b; --muted:#5a6877; --line:#d3dae2;
  --accent:#1d5ea6; --accent-ink:#ffffff; --signal:#b86400; --signal-bg:#fff3e2;
  --good:#22714a; --good-bg:#e5f4ec; --bad:#b0351f; --bad-bg:#fbe9e5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#17202a; --sunk:#121a22; --ink:#e4eaf0; --muted:#93a2b2; --line:#2a3642;
  --accent:#6da7ea; --accent-ink:#0b1824; --signal:#f0a443; --signal-bg:#33240f;
  --good:#5cc48a; --good-bg:#12291d; --bad:#ef7a62; --bad-bg:#35180f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#17202a; --sunk:#121a22; --ink:#e4eaf0; --muted:#93a2b2; --line:#2a3642;
  --accent:#6da7ea; --accent-ink:#0b1824; --signal:#f0a443; --signal-bg:#33240f;
  --good:#5cc48a; --good-bg:#12291d; --bad:#ef7a62; --bad-bg:#35180f; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:980px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
header.top .btn{white-space:nowrap}
.brand{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand small .by{color:var(--signal);font-weight:600}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.04em;color:var(--muted);text-transform:none;margin-top:2px}
.spacer{flex:1}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
@media (max-width:420px){nav.tabs a{font-size:10px;letter-spacing:0}}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 1px 9px;color:var(--muted);text-decoration:none;font-size:11px;white-space:nowrap;font-weight:600;letter-spacing:.02em}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--accent)}
main .wrap{padding-block:18px 28px;display:flex;flex-direction:column;gap:22px}
h1,h2{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:1}
h2{font-size:19px;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 14px;border-radius:8px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;min-height:32px;font-size:13px}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gauge{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.gauge .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.gauge .val{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.gauge .sub{font-size:12px;color:var(--muted)}
.gauge.warn .val{color:var(--signal)}
@media (max-width:640px){.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--sunk)}
.item .when{font-family:var(--mono);font-size:13px;color:var(--muted);line-height:1.25}
.item .who{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .what{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.item.cust{grid-template-columns:minmax(0,1fr) auto}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.booked{color:var(--accent);border-color:var(--accent)}
.pill.inshop{color:var(--ink);border-color:var(--ink)}
.pill.diag{color:var(--st-diag);border-color:var(--st-diag)}
.pill.approval{color:var(--signal);border-color:var(--signal)}
.pill.parts{color:var(--bad);border-color:var(--bad)}
.pill.working{color:var(--st-work);border-color:var(--st-work)}
/* Shop board: one column per stage, every car as a card */
:root{--st-diag:#7440c4;--st-work:#0b6f7c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--st-diag:#b896f2;--st-work:#4cc3d1}}
:root[data-theme="dark"]{--st-diag:#b896f2;--st-work:#4cc3d1}
.st-booked{--st:var(--accent)}.st-inshop{--st:var(--ink)}.st-diag{--st:var(--st-diag)}.st-approval{--st:var(--signal)}
.st-parts{--st:var(--bad)}.st-working{--st:var(--st-work)}.st-ready{--st:var(--good)}.st-done{--st:var(--muted)}.st-cancelled{--st:var(--muted)}
body.wide main .wrap,body.wide header.top .wrap{max-width:1680px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .n{font-family:var(--mono);font-size:12px;opacity:.8}
.chip .dot{width:8px;height:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(188px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}
.bcol{background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:320px;scroll-snap-align:start;min-width:0}
.bcol.over{outline:2px dashed var(--accent);outline-offset:-2px}
.bcol-h{display:flex;align-items:center;gap:8px;padding:4px 4px 2px}
.bcol-h h2{font-size:16px;color:var(--ink);line-height:1.1}
.bcol-h .n{margin-left:auto;font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--muted)}
.dot{display:inline-block;flex:none;width:10px;height:10px;border-radius:50%;background:var(--st)}
.bday{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:4px 4px 0}
.bempty{font-size:13px;color:var(--muted);text-align:center;padding:14px 6px;border:1px dashed var(--line);border-radius:10px}
.bcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 1px 2px rgba(10,16,24,.06)}
.bcard[draggable="true"]{cursor:grab}
.bcard.dragging{opacity:.45}
.bc-open{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;background:none;border:0;padding:10px 12px 8px;font:inherit;color:inherit;cursor:pointer}
.bc-open:hover{background:var(--sunk)}
.bc-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.bc-top .ro{white-space:nowrap}
.age{font-size:11px;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.age.late{background:var(--bad-bg);color:var(--bad)}
.bc-veh{font-size:14px;line-height:1.25}
.bc-what{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bc-who{font-size:12px;color:var(--muted)}
.bc-foot{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:0 8px 8px}
.chip[aria-pressed="true"] .dot{box-shadow:0 0 0 2px var(--accent-ink)}
@media (max-width:640px){.board{grid-auto-columns:minmax(260px,82vw)}}
.bc-foot select{min-height:34px;padding:4px 6px;font-size:13px}
.bc-foot select.none{border-style:dashed;color:var(--signal)}
.techrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;max-width:420px}
.pill.ready{color:var(--good);border-color:var(--good)}
.pill.done{background:var(--sunk)}
.pill.cancelled{text-decoration:line-through}
.owe{font-family:var(--mono);font-size:13px;color:var(--signal);font-variant-numeric:tabular-nums}
.paid{font-family:var(--mono);font-size:13px;color:var(--good)}
.ro{font-family:var(--mono);font-size:12px;color:var(--muted)}
.ex{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px dashed var(--line);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toolbar input[type=search]{flex:1;min-width:160px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
label.f,div.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{text-transform:none;letter-spacing:0;font-weight:400;font-size:15px}
div.f .ws-pic{text-transform:none;letter-spacing:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.qrgrid{grid-template-columns:1fr}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{font:600 13px var(--body);background:var(--surface);color:var(--muted);border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer;min-height:36px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.day{display:flex;flex-direction:column;gap:6px}
.dayhead{display:flex;align-items:baseline;gap:8px}
.dayhead b{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.dayhead.today b{color:var(--accent)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.mhd{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0}
.mday{min-height:86px;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px;display:flex;flex-direction:column;gap:2px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.mday:hover{border-color:var(--accent)}
.mday.out{opacity:.45}
.mday.closed{background:var(--sunk)}
.mday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mday .dn{font-family:var(--mono);font-size:13px;font-weight:600}
.mday.today .dn{color:var(--accent)}
.mday .mj{font-size:12px;color:var(--muted);line-height:1.25}
.mday .mj b{color:var(--ink)}
.mbar{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:auto}
.mbar i{display:block;height:100%;background:var(--good)}.mbar i.busy{background:var(--signal)}.mbar i.full{background:var(--bad)}
@media (max-width:560px){.mday{min-height:62px;padding:4px}.mday .mh{display:none}.mday .mj{font-size:10px}.mgrid{gap:3px}}
dialog{border:0;padding:0;border-radius:14px;background:var(--surface);color:var(--ink);width:min(680px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,16,24,.55)}
.sheet{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet-h h1{font-size:24px}
.sheet-b{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.ro-total{border:1px solid var(--line);border-radius:10px;background:var(--sunk);padding:10px 14px}
.ro-total table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.ro-total td{padding:3px 0}
.ro-total td:last-child{text-align:right;font-family:var(--mono)}
.ro-total tr.t td{border-top:1px solid var(--line);padding-top:6px;font-weight:600}
.ro-total tr.bal td{font-weight:600}
.pay{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end}
@media (max-width:520px){.pay{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.paylist{display:flex;flex-direction:column;gap:4px}
.payrow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:6px 10px;background:var(--sunk);border-radius:6px;font-size:14px}
.veh{display:grid;grid-template-columns:70px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:center}
@media (max-width:560px){.veh{grid-template-columns:repeat(2,minmax(0,1fr))}}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.drawer table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.drawer td{padding:7px 0;border-top:1px solid var(--line)}
.drawer tr:first-child td{border-top:0}
.drawer td:last-child{text-align:right;font-family:var(--mono)}
.drawer td input{max-width:140px;text-align:right;font-family:var(--mono);margin-left:auto;display:block}
.os{font-weight:600}
.os.over{color:var(--good)} .os.short{color:var(--bad)} .os.even{color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.data{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;min-width:520px}

table.data .r{text-align:right;font-family:var(--mono)}
.banner{padding:10px 14px;border-radius:8px;background:var(--signal-bg);color:var(--ink);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
.detail dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:0}

.detail dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}
.meth{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}

.meth .lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meth .val{font-family:var(--mono);font-size:16px}

.ws-status{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ws-dot{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.ws-dot.live{background:var(--good)}

.ws-hours{display:flex;flex-direction:column}

<script>
(function(){
const METHODS=["Cash","Debit","Credit","E-transfer","Cheque"];
// Job stages, in the order a car moves through the shop. "inshop" is the older name for Checked in.
const STATUS={booked:"Booked",inshop:"Checked in",diag:"Diagnosing",approval:"Waiting on approval",parts:"Waiting on parts",working:"In progress",ready:"Ready",done:"Picked up",cancelled:"Cancelled"};
const IN_SHOP=["inshop","diag","approval","parts","working"];
const BOARD=["booked","inshop","diag","approval","parts","working","ready"];
const isOpen=s=>s==="booked"||s==="ready"||IN_SHOP.includes(s);
const S={customers:{},jobs:{},cash:{},requests:{},settings:{shopName:"",labourRate:120,hstRate:13},loaded:{c:0,j:0,k:0},shop:null,me:null,imports:[],siteHost:""};
let db=null, dl=null, readOnly=false, route="today";
const ui={jobFilter:"open",jobQ:"",custQ:"",custSort:"name",custDir:"asc",custFilter:"all",weekStart:null,cashDay:null,cashDraft:{},siteDraft:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>{n=r2(n);return(n<0?"-$":"$")+Math.abs(n).toLocaleString("en-CA",{minimumFractionDigits:2,maximumFractionDigits:2})};
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,(m||1)-1,d||1)};
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const mondayOf=s=>{const d=parse(s);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)};
const fmtDay=s=>parse(s).toLocaleDateString("en-CA",{weekday:"short",month:"short",day:"numeric"});
const fmtLong=s=>parse(s).toLocaleDateString("en-CA",{weekday:"long",month:"long",day:"numeric"});
const fmtTime=t=>{if(!t)return"";const[h,m]=t.split(":").map(Number);const ap=h>=12?"pm":"am";return`${((h+11)%12)+1}:${pad(m)}${ap}`};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}

function totals(j){
  const rate=j.labourRate!==undefined&&j.labourRate!==""?+j.labourRate:+S.settings.labourRate||0;
  const hstRate=j.hstRate!==undefined&&j.hstRate!==""?+j.hstRate:+(S.settings.hstRate??13);
  const labour=r2((+j.labourHours||0)*rate), parts=r2(j.parts), disc=r2(j.discount);
  const sub=Math.max(0,r2(labour+parts-disc)), hst=r2(sub*hstRate/100), total=r2(sub+hst);
  const paid=r2((j.payments||[]).reduce((a,p)=>a+(+p.amount||0),0));
  return{rate,hstRate,labour,parts,disc,sub,hst,total,paid,balance:r2(total-paid)};
}
const cust=id=>S.customers[id]||null;
const custName=id=>cust(id)?.name||"Walk-in";
const jobsArr=()=>Object.values(S.jobs);
const taxName=()=>S.settings.taxName||"HST";
const isOwing=j=>(j.status==="ready"||j.status==="done")&&totals(j).balance>0.004;
const fmtPhone=v=>{const raw=String(v??"").trim(),d=raw.replace(/\D/g,""),x0=d.length>10&&d[0]==="1"?d.slice(1):d,x=x0.length===11&&x0[0]==="0"?x0.slice(1):x0;return x.length===10?`${x.slice(0,3)}-${x.slice(3,6)}-${x.slice(6)}`:raw};
// Names typed ALL CAPS or all lowercase are saved as "Title Case"; mixed case (McDonald, O'Neil) is left alone.
function tidyName(n){n=String(n||"").replace(/\s+/g," ").trim();if(!n||(n!==n.toUpperCase()&&n!==n.toLowerCase()))return n;
  return n.toLowerCase().replace(/(^|[\s\-'’])([a-z])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\bMc([a-z])/g,(m,c)=>"Mc"+c.toUpperCase())}
const tidyPostal=z=>{const c=String(z||"").replace(/\s/g,"").toUpperCase();if(/^[A-Z]\d[A-Z]\d[A-Z]\d$/.test(c))return c.slice(0,3)+" "+c.slice(3);if(/^\d{9}$/.test(c))return c.slice(0,5)+"-"+c.slice(5);return String(z||"").trim()};
const isUS=()=>S.shop&&S.shop.country==="US";
const postalLbl=()=>isUS()?"ZIP code":"Postal code";
const regionLbl=()=>isUS()?"State":"Province";
function tidyCustomer(c){c.name=tidyName(c.name);c.city=tidyName(c.city);c.email=String(c.email||"").trim().toLowerCase();c.postal=tidyPostal(c.postal);c.phone=fmtPhone(c.phone);return c}
function findDuplicates(c){
  const nm=normName(c.name),ph=fmtPhone(c.phone),em=String(c.email||"").trim().toLowerCase();
  return Object.values(S.customers).filter(o=>o.id!==c.id&&((nm&&normName(o.name)===nm)||(ph&&fmtPhone(o.phone)===ph&&/^\d{3}-\d{3}-\d{4}$/.test(ph))||(em&&String(o.email||"").toLowerCase()===em)));
}
const vehLabel=v=>v?[v.year,v.make,v.model].filter(Boolean).join(" ")+(v.plate?` · ${v.plate}`:""):"";
const exTag=o=>o&&o.example?'<span class="ex">Example</span>':"";
const techs=()=>(S.settings.techs||[]).filter(t=>t&&t.id&&String(t.name||"").trim());
const techName=j=>j&&j.techId?((techs().find(t=>t.id===j.techId)||{}).name||j.tech||""):"";
const stageSince=j=>j.statusAt||j.updated||j.created||"";
function ageText(iso){const ms=Date.now()-Date.parse(iso);if(!(ms>=0))return"";const m=Math.round(ms/60000);
  if(m<60)return`${Math.max(1,m)} min`;const h=Math.floor(m/60);if(h<24)return`${h} h`;const d=Math.floor(h/24);return`${d} day${d===1?"":"s"}`}

/* ---------- routing ---------- */
function setRoute(){
  const h=(location.hash||"").slice(1).split("?")[0];
  route=["today","board","schedule","jobs","customers","cash","website","setup","booking","import","team","billing"].includes(h)?h:"today";
  document.body.classList.toggle("wide",route==="board");
  document.querySelectorAll("nav.tabs a").forEach(a=>a.toggleAttribute("aria-current",false));
  const a=document.querySelector(`nav.tabs a[data-tab="${route}"]`);if(a)a.setAttribute("aria-current","page");
  render();
}
window.addEventListener("hashchange",setRoute);

/* ---------- render ---------- */
function render(){
  $("#brand").firstChild.nodeValue=S.settings.shopName||"XSite Auto";
  $("#brandSub").innerHTML=`${esc(fmtLong(today()))} <span class="by">· XSite Auto</span>`;
  $("#newJobTop").hidden=readOnly;
  const tb=document.querySelector('nav.tabs a[data-tab="today"]');if(tb){let bd=tb.querySelector(".nbadge");const n=newRequests().length;
    if(n){if(!bd){bd=document.createElement("span");bd.className="nbadge";tb.appendChild(bd)}bd.textContent=n}else if(bd)bd.remove()}
  const v=$("#view");
  const ready=S.loaded.c&&S.loaded.j;
  if(!db){v.innerHTML=`<div class="empty">The shop book couldn't connect. Open this page signed in to claude.ai to see and record jobs.</div>`;return}
  if(!ready){v.innerHTML=`<div class="empty" id="loadmsg">Opening the shop book. Customers, bookings and payments will appear here.</div>`;return}
  const html={today:vToday,board:vBoard,schedule:vSchedule,jobs:vJobs,customers:vCustomers,cash:vCash,website:vWebsite,setup:vSetup,booking:vBooking,import:vImport,team:vTeam,billing:vBilling}[route]();
  const bar=trialBar();
  v.innerHTML=(bar||(readOnly?`<div class="banner">You can view this book but not change it.</div>`:""))+html;
  bindView();
}

function jobItem(j,showDate){
  const t=totals(j), c=cust(j.customerId);
  const when=showDate?`${esc(fmtDay(j.date).replace(/,.*$/,""))}<br>${esc(fmtDay(j.date).split(" ").slice(1).join(" "))}`:esc(fmtTime(j.time)||"Any");
  let right=`<span class="pill ${j.status}">${STATUS[j.status]||j.status}</span>`;

async function moveJob(id,patch){

  S.jobs[id]=d;render();

}

function closedOn(d){const n=parse(d).toLocaleDateString("en-CA",{weekday:"long"});const h=(S.site?.hours||[]).find(x=>x.day===n);return h?!!(h.closed||!h.open):false}
function openHours(d){const n=parse(d).toLocaleDateString("en-CA",{weekday:"long"});const h=(S.site?.hours||[]).find(x=>x.day===n);
  if(!h||!h.open||!h.close)return 9;const[a,b]=[h.open,h.close].map(t=>{const[x,y]=t.split(":").map(Number);return x+y/60});return Math.max(1,b-a)}
function dayJobs(d){return jobsArr().filter(j=>j.date===d&&!j.opening).sort((a,b)=>(a.time||"99").localeCompare(b.time||"99"))}

  const segs=[["week","Week"],["2wk","2 weeks"],["month","Month"]].map(([k,l])=>`<button type="button" data-sv="${k}" aria-pressed="${view===k}">${l}</button>`).join("");
  const nav=`<div class="toolbar"><div class="seg" role="group" aria-label="Show">${segs}</div><div class="spacer"></div>
    <button class="btn small" type="button" data-step="-1" aria-label="Previous">‹ Prev</button>

    <button class="btn small" type="button" data-step="1" aria-label="Next">Next ›</button>
    <label class="row" style="gap:6px;font-size:13px;color:var(--muted)">Go to<input type="date" id="schedGo" style="width:auto;min-height:32px;padding:4px 8px"></label></div>`;
  let body="", sub="";
  if(view==="month"){
    const ms=ui.monthStart, first=parse(ms), mon=first.getMonth();
    const gs=mondayOf(ms), cap=Math.max(1,techs().length);
    sub=first.toLocaleDateString("en-CA",{month:"long",year:"numeric"});
    let cells=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<div class="mhd">${x}</div>`).join("");
    let n=0,h=0;
    for(let i=0;i<42;i++){

      const js=dayJobs(d).filter(j=>j.status!=="cancelled"), hrs=dayHrs(js), closed=closedOn(d);

      cells+=`<button type="button" class="mday ${inM?"":"out"} ${closed&&!js.length?"closed":""} ${d===t?"today":""}" data-mday="${d}" aria-label="${esc(fmtLong(d))}: ${js.length} job${js.length===1?"":"s"}${hrs?`, about ${hrs} hours`:""}">
        <span class="dn">${parse(d).getDate()}</span>
        ${js.length?`<span class="mj"><b>${js.length}</b><span class="mh"> job${js.length===1?"":"s"}</span></span>${hrs?`<span class="mj mh">~${hrs.toFixed(1)} h</span>`:""}<span class="mbar"><i class="${lvl}" style="width:${Math.min(100,Math.round(load*100))}%"></i></span>`:closed?`<span class="mj">Closed</span>`:""}</button>`;
    }
    body=`<div class="mgrid">${cells}</div><p class="ws-help">${n} job${n===1?"":"s"} this month, about ${r2(h).toFixed(1)} hours. The bar shows how full each day is${techs().length>1?` for ${techs().length} techs`:""}. Tap a day to see its jobs.</p>`;
  }else{
    const nd=view==="2wk"?14:7, ws=ui.weekStart;
    sub=`${fmtLong(ws)} to ${fmtLong(addDays(ws,nd-1))}`;
    for(let i=0;i<nd;i++){

      body+=`<section class="day" id="day-${d}"><div class="dayhead ${d===t?"today":""}"><b>${esc(fmtDay(d))}</b>${d===t?'<span class="muted">Today</span>':""}<div class="spacer"></div>
        <span class="muted mono" style="font-size:12px">${js.length?`${js.length} job${js.length>1?"s":""} · ~${est.toFixed(1)} h`:""}</span>
        ${readOnly?"":`<button class="btn small" type="button" data-newon="${d}">+ Book</button>`}</div>
        <div class="list">${js.length?js.map(j=>jobItem(j,false)).join(""):`<div class="empty" style="padding:12px">${closedOn(d)?"Closed":"Open"}</div>`}</div></section>`;
    }
  }
  return `<div class="row"><h1>Schedule</h1></div>${nav}<p class="muted" style="margin:0">${esc(sub)}</p>${body}`;

function dayPays(d){const out=[];jobsArr().forEach(j=>(j.payments||[]).forEach(p=>{if(p.date===d)out.push({...p,job:j})}));return out}
function drawer(d){
  const k=S.cash[d]||{};
  const cashIn=r2(dayPays(d).filter(p=>p.method==="Cash").reduce((a,p)=>a+(+p.amount||0),0));
  const flt=r2(k.float), out=r2(k.payouts), dep=r2(k.deposit);
  const expected=r2(flt+cashIn-out-dep);
  const has=k.counted!==undefined&&k.counted!=="";
  const diff=has?r2(+k.counted-expected):null;
  return{k,cashIn,flt,out,dep,expected,has,diff};
}
function vCash(){

    <table><tbody>
     <tr><td>Opening float</td><td><input id="k_float" inputmode="decimal" value="${esc(cv("float"))}" placeholder="0.00" ${ro}></td></tr>
     <tr><td>Cash taken in <span class="muted">(from jobs)</span></td><td>${money(D.cashIn)}</td></tr>
     <tr><td>Paid out of drawer <span class="muted">(parts runs, etc.)</span></td><td><input id="k_payouts" inputmode="decimal" value="${esc(cv("payouts"))}" placeholder="0.00" ${ro}></td></tr>
     <tr><td>Taken to the bank</td><td><input id="k_deposit" inputmode="decimal" value="${esc(cv("deposit"))}" placeholder="0.00" ${ro}></td></tr>
     <tr><td><b>Should be in drawer</b></td><td><b>${money(D.expected)}</b></td></tr>
     <tr><td>Counted at close</td><td><input id="k_counted" inputmode="decimal" value="${esc(cv("counted"))}" placeholder="Count it" ${ro}></td></tr>
    </tbody></table>
    <label class="f">Note<input id="k_note" value="${esc(cv("note"))}" placeholder="What the payout was for, who took the deposit" ${ro}></label>
    ${readOnly?"":`<div class="row"><button class="btn primary" type="button" id="saveCash">Save drawer</button></div>`}
   </section>
   <section class="day"><h2>Payments taken</h2>
    <div class="list">${pays.length?pays.map(p=>`<button class="item" type="button" data-job="${esc(p.job.id)}"><div class="when">${esc(p.method)}</div>
      <div style="min-width:0"><div class="who">${esc(custName(p.job.customerId))}</div><div class="what"><span class="ro">RO ${esc(p.job.ro)}</span> · ${esc(p.job.vehicle||"")}</div></div>
      <div class="right"><span class="mono">${money(p.amount)}</span></div></button>`).join(""):`<div class="empty">No payments recorded on this day.</div>`}</div></section>
   <section class="day"><h2>Last two weeks</h2>
    <div class="tablewrap"><table class="data"><thead><tr><th>Day</th><th class="r">Cash</th><th class="r">Card &amp; other</th><th class="r">Deposited</th><th class="r">Over / short</th></tr></thead>
    <tbody>${hist||`<tr><td colspan="5" class="muted">No activity yet.</td></tr>`}</tbody></table></div></section>
   <section class="panel"><div class="row"><h2>Settings</h2></div>
     <div class="grid3">

const firstName=n=>String(n||"").split(" ")[0];

async function post(url,body){const r=await fetch(url,{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify(body||{})});const d=await r.json().catch(()=>({}));if(r.status===401)location.href="/login";return{ok:r.ok,status:r.status,d}}

function trialBar(){
  const sh=S.shop;if(!sh)return"";
  if(sh.status==="trial"){const n=sh.daysLeft;
    return `<div class="trialbar"><span><b>Free trial:</b> ${n===0?"last day":n===1?"1 day left":`${n} days left`}${endDay()?`, until ${esc(endDay())}`:""}.</span><span class="spacer"></span>${setupDone()<setupSteps().length&&route!=="setup"?`<a href="#setup">Setup checklist</a>`:""}<a class="btn small primary" href="#billing">Keep XSite Auto</a></div>`}
  if(sh.status==="read_only")return `<div class="trialbar bad"><span><b>${sh.paid?"XSite Auto is paused.":"Your free trial has ended."}</b> Your customers and jobs are safe. You can still look things up and export them.</span><span class="spacer"></span><a class="btn small primary" href="#billing">${sh.paid?"Restart XSite Auto":"Keep XSite Auto"}</a></div>`;

function setupSteps(){
  const st=S.settings||{}, sh=S.shop||{};

  return[
    {k:"account",t:"Create your shop account",d:"",done:true},

async function importFile(file){
  const out=$("#imp_out");if(!file)return;
  if(file.size>5*1024*1024){out.innerHTML=`<p class="banner">That file is over 5 MB. Export just your customer list.</p>`;return}
  out.innerHTML=`<p class="ws-help">Reading ${esc(file.name)}…</p>`;
  const keep=!$("#imp_inactive").checked,noMerge=!$("#imp_merge").checked;
  ui.imp={keepInactive:keep,noMerge};
  try{const r=await fetch(`/api/import/preview?inactive=${keep?"keep":"skip"}&merge=${noMerge?"off":"on"}`,{method:"POST",credentials:"same-origin",headers:{"content-type":"application/octet-stream","x-filename":encodeURIComponent(file.name)},body:file});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ui.imp.error=d.error||d.message||"We couldn't read that file.";render();return}
    ui.imp.preview=d;ui.impFilter="";ui.impBal=false;render();
  }catch(e){ui.imp.error="Can't reach XSite Auto. Check your connection.";render()}
}

/* ---------- writes ---------- */
async function write(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){
    if(e&&e.code==="trial_ended"){toast("Your free trial has ended. Keep XSite Auto to make changes.");readOnly=true;render()}
    else if(e&&e.code==="forbidden"){toast(e.message||"You can't change that.")}
    else if(e&&e.code==="invalid_argument"&&readOnly===false){toast("This book is view-only for you");readOnly=true;render()}
    else toast(e&&e.code==="quota_exceeded"?"The book is full. Remove old example data.":"Couldn't save. Check your connection and try again.");
    return false;
  }
}

async function clearExamples(){

async function exportCsv(){
  const d=ui.cashDay, mon=d.slice(0,7);
  const rows=[["Date","RO","Customer","Phone","Vehicle","Method","Amount","Job total","Labour","Parts","Discount",taxName(),"Balance"]];
  jobsArr().forEach(j=>{const t=totals(j);(j.payments||[]).forEach(p=>{if(String(p.date).startsWith(mon))rows.push([p.date,j.ro,custName(j.customerId),fmtPhone(cust(j.customerId)?.phone)||"",j.vehicle||"",p.method,r2(p.amount).toFixed(2),t.total.toFixed(2),t.labour.toFixed(2),t.parts.toFixed(2),t.disc.toFixed(2),t.hst.toFixed(2),t.balance.toFixed(2)])})});
  rows.splice(1,rows.length-1,...rows.slice(1).sort((a,b)=>a[0].localeCompare(b[0])));
  const csv=rows.map(r=>r.map(x=>{x=String(x);return /[",\n]/.test(x)?`"${x.replace(/"/g,'""')}"`:x}).join(",")).join("\n");
  try{await dl.save({filename:`payments-${mon}.csv`,data:csv});toast("Export ready")}
  catch(e){if(!e||e.code!=="declined")toast("Couldn't export the file")}
}

const digits=v=>{const d=String(v??"").replace(/\D/g,"");let x=d.length>10&&d[0]==="1"?d.slice(1):d;if(x.length===11&&x[0]==="0")x=x.slice(1);return x.length===10?x:""};
function confirmText(j,c){
  const site=S.site||{}, first=(c.name||"").split(" ")[0];
  const where=[site.street,site.town].filter(Boolean).join(", ");
  return `Hi ${first}, you're booked at ${S.settings.shopName||"the shop"} for ${fmtDay(j.date)}${j.time?" at "+fmtTime(j.time):""}${j.vehicle?" ("+j.vehicle+")":""}.${where?" "+where+".":""} Reply here if anything changes. Thanks!`;
}
function openConfirm(id){
  const j=S.jobs[id], c=j&&cust(j.customerId);if(!j||!c){closeSheet();return}
  const prefer=j.contactBy||"call", phone=digits(c.phone||"");
  const msg=confirmText(j,c);
  const smsHref=phone?`sms:+1${phone}?&body=${encodeURIComponent(msg)}`:"";
  // Phones, iPads and Macs have Messages; Windows and Linux computers usually have nothing to open a text link.
  const noSms=/Windows|Linux|CrOS/i.test(navigator.userAgent)&&!/Android/i.test(navigator.userAgent);
  openSheet(`<div class="sheet-h"><h1>Confirm with ${esc((c.name||"").split(" ")[0])}</h1><div class="spacer"></div><button class="btn small" type="button" id="xClose">Done</button></div>
  <div class="sheet-b">
    <p class="banner">${esc(c.name)} is booked for <b>${esc(fmtDay(j.date))}${j.time?" at "+esc(fmtTime(j.time)):""}</b>. They asked to be confirmed by <b>${prefer==="text"?"text":prefer==="email"?"email":"phone call"}</b>.</p>
    <label class="f">Message<textarea id="cf_msg" rows="4">${esc(msg)}</textarea></label>
    <div class="row" style="gap:8px;flex-wrap:wrap">
      ${smsHref?(noSms?`<button class="btn ${prefer==="text"?"primary":""}" type="button" id="cf_smscopy">Copy text for your phone</button>`:`<a class="btn ${prefer==="text"?"primary":""}" id="cf_sms" href="${esc(smsHref)}">Text confirmation</a>`):""}
      <button class="btn ${prefer==="email"?"primary":""}" type="button" id="cf_email" ${c.email?"":"disabled"}>Email confirmation</button>
      <button class="btn" type="button" id="cf_copy">Copy message</button>
      ${phone?`<a class="btn ${prefer==="call"?"primary":""}" href="tel:+1${phone}" id="cf_call">Call ${esc(fmtPhone(c.phone))}</a>`:""}
    </div>
    <p class="ws-help">${c.email?`Email sends from the shop's address with a calendar invite.`:"No email on file for this customer."} ${noSms?"On this computer, copy the text and send it from your phone.":"Text confirmation opens Messages with the message ready to send."}</p>
    <div id="cf_out"></div>
  </div>`);
  const q=s=>sheet.querySelector(s);
  q("#xClose").onclick=closeSheet;
  const mark=async by=>{const d={...S.jobs[id],confirmedAt:new Date().toISOString(),confirmedBy:by};await write(()=>db.doc("jobs/"+id).set(d));S.jobs[id]=d};
  const ms=q("#cf_msg");
  const sm=q("#cf_sms");if(sm){ms.addEventListener("input",()=>{sm.href=`sms:+1${phone}?&body=${encodeURIComponent(ms.value)}`});sm.addEventListener("click",()=>{mark("text");q("#cf_out").innerHTML=`<p class="banner">Marked as confirmed by text. Tap Done when it's sent.</p>`})}
  const sc=q("#cf_smscopy");if(sc)sc.onclick=async()=>{let ok=true;try{await navigator.clipboard.writeText(ms.value)}catch(e){ok=false;ms.select()}
    q("#cf_out").innerHTML=`<div class="banner">${ok?"Copied.":"Select the message and copy it."} Text it to <b>${esc(fmtPhone(phone))}</b> from your phone, then <button class="btn small" type="button" id="cf_texted">Mark as texted</button></div>`;
    q("#cf_texted").onclick=async()=>{await mark("text");q("#cf_out").innerHTML=`<p class="banner">Marked as confirmed by text.</p>`}};
  const cl=q("#cf_call");if(cl)cl.addEventListener("click",()=>mark("phone"));
  q("#cf_copy").onclick=async()=>{try{await navigator.clipboard.writeText(ms.value);toast("Message copied")}catch(e){ms.select()}};
  const em=q("#cf_email");if(em)em.onclick=async()=>{em.disabled=true;em.textContent="Sending…";
    try{const r=await fetch("/api/notify/confirm",{method:"POST",credentials:"same-origin",headers:{"content-type":"application/json"},body:JSON.stringify({jobId:id})});
      const d=await r.json().catch(()=>({}));
      if(r.ok){toast("Confirmation emailed to "+d.to);if(db.refresh)db.refresh().catch(()=>{});closeSheet();return}
      q("#cf_out").innerHTML=`<p class="banner">${esc(d.error||"The email didn't go through.")}</p>`}
    catch(e){q("#cf_out").innerHTML=`<p class="banner">Can't reach the shop book. Try again.</p>`}
    em.disabled=false;em.textContent="Email confirmation"};
}

function openCustomer(id){
  const c=S.customers[id];if(!c)return;
  const js=jobsArr().filter(j=>j.customerId===id).sort((a,b)=>b.date.localeCompare(a.date));
  const spent=r2(js.reduce((a,j)=>a+totals(j).paid,0)), owe=r2(js.filter(isOwing).reduce((a,j)=>a+totals(j).balance,0));
  openSheet(`<div class="sheet-h"><h1>${esc(c.name)}</h1>${exTag(c)}<div class="spacer"></div><button class="btn small" type="button" id="xClose">Close</button></div>
  <div class="sheet-b detail">
    <dl>
      <dt>Phone</dt><dd class="mono">${esc(fmtPhone(c.phone)||"–")}</dd>
      <dt>Email</dt><dd>${esc(c.email||"–")}</dd>
      <dt>Address</dt><dd>${esc([c.street,c.city,c.postal].filter(Boolean).join(", ")||"–")}</dd>
      <dt>Vehicles</dt><dd>${(c.vehicles||[]).length?c.vehicles.map(v=>esc(vehLabel(v))+(v.vin?` <span class="ro">VIN ${esc(v.vin)}</span>`:"")).join("<br>"):"–"}</dd>
      <dt>Paid to date</dt><dd class="mono">${money(spent)}</dd>
      ${owe>0?`<dt>Owing</dt><dd class="owe">${money(owe)}</dd>`:""}
      ${c.notes?`<dt>Notes</dt><dd>${esc(c.notes)}</dd>`:""}
    </dl>
    <h2>Visits</h2>
    <div class="list">${js.length?js.map(j=>jobItem(j,true)).join(""):`<div class="empty">No visits yet.</div>`}</div>
    ${histHtml(c)}
  </div>
  <div class="sheet-f">${readOnly?"":`<button class="btn primary" type="button" id="cBook">Book a job</button><button class="btn" type="button" id="cEdit">Edit details</button>`}</div>`);
  const dups=findDuplicates(c);
  if(dups.length&&!readOnly){const box=document.createElement("div");box.className="dupbox";
    box.innerHTML=`<b>Possible duplicate${dups.length>1?"s":""}</b>${dups.map(o=>`<div class="row"><span>${esc(o.name)}<small>${esc([fmtPhone(o.phone),o.email].filter(Boolean).join(" · ")||"No contact details")} · ${jobsArr().filter(j=>j.customerId===o.id).length} visit(s)</small></span><div class="spacer"></div><button class="btn small" type="button" data-merge="${esc(o.id)}">Merge into this record</button></div>`).join("")}<div id="mergeConfirm"></div>`;
    sheet.querySelector(".sheet-b").prepend(box);
    box.querySelectorAll("[data-merge]").forEach(bt=>bt.onclick=()=>{const o=S.customers[bt.dataset.merge],n=jobsArr().filter(j=>j.customerId===o.id).length;
      box.querySelector("#mergeConfirm").innerHTML=`<div class="banner">Merge <b>${esc(o.name)}</b> into <b>${esc(c.name)}</b>? ${n?`Their ${n} job${n>1?"s":""} and payments move over. `:""}Vehicles are combined and missing details filled in. The duplicate record is then removed.<div class="row" style="margin-top:8px"><button class="btn small primary" type="button" id="mergeYes">Merge</button><button class="btn small" type="button" id="mergeNo">Cancel</button></div></div>`;
      box.querySelector("#mergeNo").onclick=()=>box.querySelector("#mergeConfirm").innerHTML="";
      box.querySelector("#mergeYes").onclick=()=>mergeCustomers(id,o.id)})}
  sheet.querySelector("#xClose").onclick=closeSheet;
  sheet.querySelectorAll("[data-job]").forEach(b=>b.onclick=()=>openJob(b.dataset.job));
  const bk=sheet.querySelector("#cBook");if(bk)bk.onclick=()=>openJob(null,{customerId:id,vehicle:vehLabel((c.vehicles||[])[0])});
  const ed=sheet.querySelector("#cEdit");if(ed)ed.onclick=()=>openCustomerForm(id);
}

      <label class="f">${postalLbl()}<input id="c_postal" value="${esc(c.postal)}" placeholder="${isUS()?"14226":"L0S 1E0"}"></label></div>
      <div class="panel" style="padding:12px"><h2>Vehicles</h2><div id="c_vehs" style="display:flex;flex-direction:column;gap:10px">${c.vehicles.map(vrow).join("")}</div>
       <button class="btn small" type="button" id="c_addv" style="align-self:flex-start">+ Another vehicle</button></div>
      <label class="f">Notes<textarea id="c_notes" placeholder="Prefers texts, has a second car at the cottage">${esc(c.notes)}</textarea></label>
      <div id="c_err"></div>
    </div>
    <div class="sheet-f"><button class="btn primary" type="button" id="c_save">Save customer</button><div class="spacer"></div>
      ${base?`<button class="btn danger" type="button" id="c_del">Delete</button>`:""}</div><div id="c_delc" class="gut" style="padding-bottom:12px"></div>`);
    const q=s=>sheet.querySelector(s);
    const pull=()=>{["name","phone","email","street","city","postal","notes"].forEach(k=>c[k]=q("#c_"+k).value.trim());
      c.phone=fmtPhone(c.phone);c.vehicles=[...sheet.querySelectorAll(".veh")].map(r=>{const o={};r.querySelectorAll("[data-k]").forEach(i=>o[i.dataset.k]=i.value.trim());return o})};
    const ph=q("#c_phone");ph.addEventListener("input",()=>{let d=ph.value.replace(/\D/g,"");if(d.length===11&&d[0]==="1")d=d.slice(1);if(d.length<=10)ph.value=d.slice(0,3)+(d.length>3?"-"+d.slice(3,6):"")+(d.length>6?"-"+d.slice(6):"")});ph.addEventListener("blur",()=>{ph.value=fmtPhone(ph.value)});
    q("#c_addv").onclick=()=>{pull();c.vehicles.push({year:"",make:"",model:"",plate:"",vin:""});draw()};
    sheet.querySelectorAll("[data-rmv]").forEach(b=>b.onclick=()=>{pull();c.vehicles.splice(+b.dataset.rmv,1);if(!c.vehicles.length)c.vehicles.push({year:"",make:"",model:"",plate:"",vin:""});draw()});

    q("#c_save").onclick=async()=>{pull();

      c.vehicles=c.vehicles.filter(v=>v.year||v.make||v.model||v.plate||v.vin);
      const badV=c.vehicles.find(v=>!/^(19|20)\d\d$/.test(String(v.year||"").trim())||!String(v.make||"").trim()||!String(v.model||"").trim());

        if(row){const miss=["year","make","model"].find(k=>{const x=row.querySelector(`[data-k="${k}"]`).value.trim();return k==="year"?!/^(19|20)\d\d$/.test(x):!x});row.querySelector(`[data-k="${miss}"]`).focus()}

      if(!await write(()=>db.doc("customers/"+c.id).set(doc),"Customer saved"))return;
      S.customers[c.id]=doc;
      if(returnToJob){draft.customerId=c.id;if(!draft.vehicle&&c.vehicles[0])draft.vehicle=vehLabel(c.vehicles[0]);drawJob(!S.jobs[draft.id])}

      q("#cdYes").onclick=async()=>{if(await write(()=>db.doc("customers/"+id).delete(),"Customer deleted"))closeSheet()}};
  };
  draw();
}

  for(const k of ["googlePlaceId","googleReviewsUrl","facebookUrl"])if(!o[k])o[k]=SITE_BLANK[k];return o};

function getPath(o,path){return path.split(".").reduce((t,k)=>t==null?t:t[k],o)}
function siteMissing(d){const m=[];if(!fmtPhone(d.phone).match(/^\d{3}-\d{3}-\d{4}$/))m.push("Phone number");if(!d.street||!d.town)m.push("Street address and town");
  if(!d.hours.some(h=>!h.closed&&h.open&&h.close))m.push("Opening hours");if(!d.services.some(s=>s.name))m.push("At least one service");return m}

function shrinkImage(file,max=1600){
  return new Promise((res,rej)=>{const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");
      c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error("shrink")),"image/jpeg",0.82)};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("read"))};img.src=url});
}
async function uploadPhoto(file){
  const blob=await shrinkImage(file);
  const r=await fetch("/api/photos",{method:"POST",credentials:"same-origin",headers:{"content-type":"image/jpeg"},body:blob});
  if(r.status===401){location.href="/login";throw new Error("signed out")}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Upload failed");return j.url;
}

async function mergeCustomers(keepId,dropId){
  const keep=JSON.parse(JSON.stringify(S.customers[keepId])),drop=S.customers[dropId];if(!drop)return;
  const before=JSON.parse(JSON.stringify(keep)),extra=[];
  ["phone","email","street","city","postal"].forEach(k=>{const a=String(keep[k]||"").trim(),b=String(drop[k]||"").trim();
    if(!a&&b)keep[k]=drop[k];else if(a&&b&&a.toLowerCase()!==b.toLowerCase()&&(k==="phone"||k==="email"))extra.push(`Other ${k}: ${k==="phone"?fmtPhone(b):b}`)});
  keep.vehicles=keep.vehicles||[];
  (drop.vehicles||[]).forEach(v=>{const f=findVehicle(keep.vehicles,v);if(!f)keep.vehicles.push(v);else if(v.plate&&!f.plate)f.plate=v.plate});
  keep.notes=[keep.notes,drop.notes,...extra].map(x=>String(x||"").trim()).filter(Boolean).filter((x,i,a)=>a.indexOf(x)===i).join("\n");
  tidyCustomer(keep);keep.updated=new Date().toISOString();
  logChange(keep,before,"Merged with "+drop.name);
  if(!await write(()=>db.doc("customers/"+keepId).set(keep)))return;
  for(const j of jobsArr().filter(j=>j.customerId===dropId)){const nj={...j,customerId:keepId};delete nj.id;
    if(!await write(()=>db.doc("jobs/"+j.id).set({...nj,id:j.id})))return}
  if(await write(()=>db.doc("customers/"+dropId).delete(),"Customers merged")){S.customers[keepId]=keep;delete S.customers[dropId];openCustomer(keepId)}
}

/* ---------- change history on each customer ---------- */
const HIST_FIELDS=[["name","name"],["phone","phone"],["email","email"],["street","street"],["city","town"],["postal","postal code"],["notes","notes"]];
function diffCustomer(before,after){
  const added=[],changed=[];
  HIST_FIELDS.forEach(([k,l])=>{const a=String((before&&before[k])||"").trim(),b=String((after&&after[k])||"").trim();
    if(a===b)return;if(!a&&b)added.push(l);else changed.push(l)});
  const vk=v=>vehKey(v||{}), bv=new Set(((before&&before.vehicles)||[]).map(vk)), av=new Set(((after&&after.vehicles)||[]).map(vk));
  const vAdd=[...av].filter(x=>!bv.has(x)).length, vDel=[...bv].filter(x=>!av.has(x)).length;
  if(vAdd&&!vDel)added.push(vAdd>1?"vehicles":"vehicle");else if(vAdd||vDel)changed.push("vehicles");
  return {added,changed};
}
function logChange(doc,before,by){
  const {added,changed}=diffCustomer(before,doc);
  if(!before)doc.history=[{date:new Date().toISOString(),by,created:true}];
  else if(added.length||changed.length)doc.history=[...(doc.history||[]),{date:new Date().toISOString(),by,added,changed}].slice(-30);
  return doc;
}
function histHtml(c){
  const h=(c.history||[]).slice().reverse();if(!h.length)return"";
  return `<h2>Changes</h2><ul class="hist">${h.slice(0,12).map(e=>`<li><span class="mono">${esc(new Date(e.date).toLocaleDateString("en-CA",{month:"short",day:"numeric",year:"numeric"}))}</span> · ${esc(e.by)} · ${esc(e.created?"customer added":[e.added&&e.added.length?"added "+e.added.join(", "):"",e.changed&&e.changed.length?"changed "+e.changed.join(", "):""].filter(Boolean).join("; "))}</li>`).join("")}</ul>`;
}

const newRequests=()=>Object.values(S.requests||{}).filter(r=>r.status==="new").sort((a,b)=>(b.submitted||"").localeCompare(a.submitted||""));
const reqVeh=r=>{const v=r.vehicle||{};return [v.year,v.make,v.model].filter(Boolean).join(" ")+(v.plate?` · ${v.plate}`:"")};
const VISIT={wait:"Waiting",drop:"Leaving the vehicle",ride:"Needs a ride"};
const reqOdo=r=>r.odometer?`${Number(r.odometer).toLocaleString("en-US")} ${r.odoUnit==="mi"?"mi":"km"}`:"";
const ago=iso=>{const m=Math.round((Date.now()-new Date(iso))/60000);if(m<1)return"just now";if(m<60)return m+" min ago";const h=Math.round(m/60);if(h<24)return h+" h ago";return new Date(iso).toLocaleDateString("en-CA",{month:"short",day:"numeric"})};

const normName=n=>String(n||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function reqMatches(r){
  const ph=fmtPhone(r.phone), em=(r.email||"").toLowerCase(), nm=normName(r.name), out=[];
  Object.values(S.customers).forEach(c=>{const why=[];
    if(ph&&fmtPhone(c.phone)===ph)why.push("same phone");
    if(em&&(c.email||"").toLowerCase()===em)why.push("same email");
    if(nm&&normName(c.name)===nm)why.push("same name");
    if(why.length)out.push({c,why})});
  return out.sort((a,b)=>b.why.length-a.why.length).slice(0,4);
}
const RQ_FIELDS=[["name","Name"],["phone","Phone"],["email","Email"],["street","Street"],["city","Town"],["postal","Postal / ZIP"]];
const vehKey=v=>v.plate?("p:"+String(v.plate).toUpperCase()):("m:"+[v.year,v.make,v.model].join(" ").toLowerCase().trim());
// Same vehicle if the plates match, or (when either plate is blank) the year, make and model match.
const normPlate=p=>String(p||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const ymm=v=>[v.year,v.make,v.model].map(x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"")).join("|");
function sameVehicle(a,b){a=a||{};b=b||{};const pa=normPlate(a.plate),pb=normPlate(b.plate);
  if(pa&&pb)return pa===pb;return ymm(a)===ymm(b)&&ymm(a)!=="||"}
function findVehicle(list,v){return (list||[]).find(x=>sameVehicle(x,v))}
let rqState=null;
function openRequest(id){
  const r=S.requests[id];if(!r)return;
  const matches=reqMatches(r);
  rqState={id,target:matches.length?matches[0].c.id:"__new",use:{},addVeh:true,confirmDismiss:false};
  drawRequest();
}
function drawRequest(){
  const r=S.requests[rqState.id];if(!r){closeSheet();return}
  const matches=reqMatches(r), ro=readOnly?"disabled":"";
  const tgt=rqState.target==="__new"?null:S.customers[rqState.target];
  const val=(o,k)=>k==="phone"?fmtPhone(o&&o[k]):String((o&&o[k])||"").trim();
  const rows=RQ_FIELDS.map(([k,l])=>{const sent=val(r,k),have=val(tgt,k);
    if(!sent)return"";
    if(!tgt)return`<tr><td>${l}</td><td class="nil">–</td><td>${esc(sent)}</td><td class="use">✓</td></tr>`;
    if(sent.toLowerCase()===have.toLowerCase())return`<tr><td>${l}</td><td>${esc(have)}</td><td class="same">Same</td><td class="use"></td></tr>`;
    if(!(k in rqState.use))rqState.use[k]=!have;
    return`<tr class="${have?"diff":""}"><td>${l}${have?'<small class="diffnote">Different. Tick to replace</small>':""}</td><td>${have?esc(have):'<span class="nil">–</span>'}</td><td><b>${esc(sent)}</b></td><td class="use"><input type="checkbox" data-use="${k}" ${rqState.use[k]?"checked":""} ${ro} aria-label="Use the new ${l.toLowerCase()}"></td></tr>`}).join("");
  const v=r.vehicle||{}, hasVeh=v.year||v.make||v.model||v.plate;
  const known=hasVeh&&tgt&&findVehicle(tgt.vehicles,v);
  const when=[r.prefDate?fmtDay(r.prefDate):"",r.prefTime&&r.prefTime!=="any"?(/^\d{2}:\d{2}$/.test(r.prefTime)?fmtTime(r.prefTime):r.prefTime):""].filter(Boolean).join(", ");
  openSheet(`<div class="sheet-h"><h1>${r.kind==="checkin"?"Check-in":"Booking request"}</h1><div class="spacer"></div><button class="btn small" type="button" id="xClose">Close</button></div>
  <div class="sheet-b">
    <div class="rq-box"><p><b>${esc(r.name)}</b> · <span class="mono">${esc(fmtPhone(r.phone))}</span>${r.email?` · ${esc(r.email)}`:""}</p>
      ${r.returning?`<p><span class="pill ready">Says they've been here before</span></p>`:""}
      ${hasVeh?`<p>${esc(reqVeh(r))}${reqOdo(r)?` · ${esc(reqOdo(r))}`:""}</p>`:r.vehicleNote?`<p>Vehicle: ${esc(r.vehicleNote)}${reqOdo(r)?` · ${esc(reqOdo(r))}`:""}</p>`:reqOdo(r)?`<p>${esc(reqOdo(r))}</p>`:""}
      ${r.visit?`<p><b>${esc(VISIT[r.visit]||"")}</b></p>`:""}
      <p>${esc(r.concern)}</p>
      <p class="muted" style="font-size:13px">Sent ${esc(ago(r.submitted))}${when?` · Prefers ${esc(when)}`:""} · Reach by ${esc(r.contactBy||"call")}</p></div>
    <h2>Whose record is this?</h2>
    <div class="rq-match">
      ${matches.map(m=>`<label><input type="radio" name="rqt" value="${esc(m.c.id)}" ${rqState.target===m.c.id?"checked":""} ${ro}><span><b>${esc(m.c.name)}</b><small>${esc([fmtPhone(m.c.phone),m.c.email].filter(Boolean).join(" · ")||"No contact details on file")} · ${esc(m.why.join(", "))}</small></span></label>`).join("")}
      <label><input type="radio" name="rqt" value="__new" ${rqState.target==="__new"?"checked":""} ${ro}><span><b>New customer</b><small>${matches.length?"None of these":r.returning?"No match on name or phone. Check Customers for a different spelling before creating a new one.":"No existing customer matches this name, phone or email"}</small></span></label>
    </div>
    <div class="rq-tbl"><table><thead><tr><th>Detail</th><th>On file</th><th>They sent</th><th>${tgt?"Use":""}</th></tr></thead><tbody>${rows}</tbody></table></div>
    ${tgt?`<p class="ws-help">Ticked items replace what's on file. Missing details are ticked for you. Highlighted rows are different from what's on file: tick them if the customer's details have changed.</p>`:""}
    ${hasVeh?(known?`<p class="ws-help">This vehicle is already on file${known.plate&&!v.plate?` (plate ${esc(known.plate)})`:""}, so it won't be added again.</p>`:`<label class="ck"><input type="checkbox" id="rqVeh" ${rqState.addVeh?"checked":""} ${ro}>Add ${esc(reqVeh(r))} to their vehicles</label>`):""}
    <div id="rqDis"></div>
  </div>
  <div class="sheet-f">${readOnly?"":`<button class="btn primary" type="button" id="rqBook">Save and book job</button><button class="btn" type="button" id="rqSave">Save customer only</button><div class="spacer"></div><button class="btn danger" type="button" id="rqDismiss">Dismiss</button>`}</div>`);
  const q=x=>sheet.querySelector(x);
  q("#xClose").onclick=closeSheet;
  sheet.querySelectorAll('input[name="rqt"]').forEach(i=>i.onchange=()=>{rqState.target=i.value;rqState.use={};drawRequest()});
  sheet.querySelectorAll("[data-use]").forEach(i=>i.onchange=()=>{rqState.use[i.dataset.use]=i.checked});
  const av=q("#rqVeh");if(av)av.onchange=()=>{rqState.addVeh=av.checked};
  const b=q("#rqBook");if(b)b.onclick=()=>acceptRequest(true);
  const s2=q("#rqSave");if(s2)s2.onclick=()=>acceptRequest(false);
  const d=q("#rqDismiss");if(d)d.onclick=()=>{q("#rqDis").innerHTML=`<div class="banner row">Dismiss this request? Nothing is saved to customers.<div class="spacer"></div><button class="btn small danger" type="button" id="rqDisYes">Dismiss</button></div>`;
    q("#rqDisYes").onclick=async()=>{if(await write(()=>db.doc("requests/"+r.id).set({...stripId(r),status:"dismissed",handled:new Date().toISOString()}),"Request dismissed"))closeSheet()}};
}
const stripId=o=>{const x={...o};delete x.id;return x};
async function acceptRequest(book){
  const r=S.requests[rqState.id];if(!r)return;
  const isNew=rqState.target==="__new";
  const before=isNew?null:JSON.parse(JSON.stringify(S.customers[rqState.target]));
  const base=isNew?{id:uid(),name:"",phone:"",email:"",street:"",city:"",postal:"",notes:"",vehicles:[],created:new Date().toISOString(),source:"Online "+(r.kind==="checkin"?"check-in":"booking")}:JSON.parse(JSON.stringify(S.customers[rqState.target]));
  RQ_FIELDS.forEach(([k])=>{const sent=String(r[k]||"").trim();if(!sent)return;if(isNew||rqState.use[k])base[k]=k==="phone"?fmtPhone(sent):sent});
  const v=r.vehicle||{}, hasVeh=v.year||v.make||v.model||v.plate;
  base.vehicles=base.vehicles||[];
  const onFile=hasVeh?findVehicle(base.vehicles,v):null;
  if(hasVeh&&onFile&&v.plate&&!onFile.plate)onFile.plate=v.plate;   // fill in a missing plate on the existing vehicle
  if(hasVeh&&rqState.addVeh&&!onFile)base.vehicles.push({year:v.year||"",make:v.make||"",model:v.model||"",plate:v.plate||"",vin:""});
  tidyCustomer(base);
  base.updated=new Date().toISOString();
  logChange(base,before,"Online "+(r.kind==="checkin"?"check-in":"booking"));
  const cid=base.id;
  if(!await write(()=>db.doc("customers/"+cid).set(base)))return;
  S.customers[cid]=base;
  await write(()=>db.doc("requests/"+r.id).set({...stripId(r),status:"accepted",customerId:cid,handled:new Date().toISOString()}),book?null:"Customer saved");
  if(book){
    const note=(r.vehicleNote||"").toLowerCase(), words=note.split(/[^a-z0-9]+/).filter(w=>w.length>2);
    const picked=(base.vehicles||[]).find(x=>words.some(w=>vehLabel(x).toLowerCase().includes(w)))||(base.vehicles||[])[0];
    openJob(null,{customerId:cid,vehicle:onFile?vehLabel(onFile):hasVeh?reqVeh(r):picked?vehLabel(picked):(r.vehicleNote||""),concern:r.concern||"",date:r.prefDate||today(),
      time:/^\d{2}:\d{2}$/.test(r.prefTime||"")?r.prefTime:r.prefTime==="afternoon"?"13:00":"09:00",status:r.kind==="checkin"?"inshop":"booked",fromRequest:r.id,contactBy:r.contactBy||"call",
      odometer:r.odometer?Number(r.odometer).toLocaleString("en-US")+(r.odoUnit==="mi"?" mi":" km"):"",estHours:r.estHours||"",notes:r.visit?VISIT[r.visit]||"":""});
  }else closeSheet();
}

$("#newJobTop").onclick=()=>openJob(null);

/* ---------- data ---------- */
function subscribe(){
  const timer=setTimeout(()=>{const m=$("#loadmsg");if(m)m.textContent="The shop book can't be reached right now. It will fill in as soon as the connection comes back."},10000);
  const done=()=>{if(S.loaded.c&&S.loaded.j)clearTimeout(timer)};
  const fail=e=>{clearTimeout(timer);const v=$("#view");if(e&&e.code==="revoked")return;v.innerHTML=`<div class="empty">The shop book stopped updating. Reload the page to reconnect.</div>`};
  const intoMap=(snap,key,flag)=>{const m={};snap.docs.forEach(d=>{m[d.id]={...d.data(),id:d.id}});S[key]=m;if(!snap.metadata.fromCache)S.loaded[flag]=1;else S.loaded[flag]=S.loaded[flag]||(snap.size?1:0);done();if(!dlg.open||key==="cash")render();else render()};
  db.collection("customers").onSnapshot(s=>intoMap(s,"customers","c"),fail);
  db.collection("jobs").onSnapshot(s=>intoMap(s,"jobs","j"),fail);
  db.collection("requests").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]={...d.data(),id:d.id});S.requests=m;render()},()=>{});
  db.collection("cash").onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.cash=m;S.loaded.k=1;render()},fail);
  db.doc("settings/site").onSnapshot(d=>{const was=ui.siteDraft&&!siteDirty();S.site=d.exists?d.data():null;S.loaded.s=1;
    if(was){ui.siteDraft=null;ui.siteBase=null}   // nothing typed yet: show the newest saved copy
    if(route==="website")render()},()=>{});
  db.doc("settings/shop").onSnapshot(d=>{if(d.exists)S.settings={...S.settings,...d.data()};render()},()=>{});
}

function remoteDb(){
  let store={customers:{},jobs:{},cash:{},settings:{},requests:{}}, ready=false, lastRaw="";
  const subs=[], meta={fromCache:false,hasPendingWrites:false};
  const notify=()=>{if(ready)subs.forEach(f=>f())};
  const coll=c=>store[c]||(store[c]={});
  const signedOut=()=>{location.href="/login";return{code:"signed_out"}};
  let writeSeq=0;
  async function pull(){
    const seq=writeSeq;
    const r=await fetch("/api/data",{cache:"no-store",credentials:"same-origin"});
    if(r.status===401)throw signedOut();
    if(!r.ok)throw{code:"unavailable"};
    const raw=await r.text();
    if(seq!==writeSeq){setTimeout(()=>pull().catch(()=>{}),300);return}   // a save happened while this was loading; fetch again
    if(raw===lastRaw)return;lastRaw=raw;const d=JSON.parse(raw);store={customers:d.customers||{},jobs:d.jobs||{},cash:d.cash||{},settings:d.settings||{},requests:d.requests||{}};S.shop=d.shop||null;S.me=d.me||null;S.imports=d.imports||[];S.siteHost=d.siteHost||"";readOnly=!!(S.shop&&!["trial","active","past_due"].includes(S.shop.status));ready=true;notify();
  }
  const refresh=()=>{if(!document.hidden)pull().catch(()=>{})};
  pull().catch(e=>{if(e&&e.code!=="signed_out"){const m=$("#loadmsg");if(m)m.textContent="Can't reach the shop book. Check your connection; it will retry on its own."}});
  setInterval(refresh,20000);
  document.addEventListener("visibilitychange",refresh);window.addEventListener("focus",refresh);window.addEventListener("online",refresh);
  async function send(method,c,id,body){
    writeSeq++;
    const r=await fetch(`/api/docs/${encodeURIComponent(c)}/${encodeURIComponent(id)}`,{method,credentials:"same-origin",headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined});
    if(r.status===401)throw signedOut();
    if(r.status===403){const e=await r.json().catch(()=>({}));if(e.error==="trial_ended"){lastRaw="";pull().catch(()=>{});throw{code:"trial_ended"}}throw{code:"forbidden",message:e.error}}
    if(!r.ok)throw{code:"unavailable"};
  }
  return{
    refresh:()=>{lastRaw="";return pull()},
    doc:p=>{const[c,id]=p.split("/");return{
      set:async d=>{await send("PUT",c,id,d);coll(c)[id]=JSON.parse(JSON.stringify(d));lastRaw="";notify()},
      delete:async()=>{await send("DELETE",c,id);delete coll(c)[id];lastRaw="";notify()},
      onSnapshot:next=>{const f=()=>{const d=coll(c)[id];next({id,exists:!!d,data:()=>d,metadata:meta})};subs.push(f);if(ready)f();return()=>{}}}},
    collection:c=>({onSnapshot:next=>{const f=()=>{const docs=Object.entries(coll(c)).map(([id,d])=>({id,exists:true,data:()=>d,metadata:meta}));next({docs,size:docs.length,empty:!docs.length,metadata:meta,docChanges:()=>[]})};subs.push(f);if(ready)f();return()=>{}}}),
    _export:()=>JSON.stringify({app:"xsite-auto-shop-book",version:1,saved:new Date().toISOString(),customers:store.customers,jobs:store.jobs,cash:store.cash,settings:store.settings},null,1),
    _import:async t=>{const o=JSON.parse(t);if(!["xsite-auto-shop-book","forks-auto-repair-shop-book","forks-road-shop-book"].includes(o.app))throw new Error("bad");
      for(const c of ["customers","jobs","cash","settings"])for(const[id,d]of Object.entries(o[c]||{}))await send("PUT",c,id,d);
      await pull();}
  };
}
const fileDl={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/octet-stream"}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return{status:"saved"}}};
$("#signOut").onclick=async()=>{try{await fetch("/api/auth/logout",{method:"POST",credentials:"same-origin"})}catch(e){}location.href="/login"};
window.addEventListener("beforeunload",e=>{if(siteDirty()){e.preventDefault();e.returnValue=""}});
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
(async()=>{
  setRoute();
  db=remoteDb();dl=fileDl;subscribe();render();
})();
})();
